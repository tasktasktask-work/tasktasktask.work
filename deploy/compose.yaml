# VPS のプロジェクトディレクトリに置くのはこのファイルと .env、
# それに ./data/attachments だけである。ソースコードは置かない。
#
#   docker compose pull
#   docker compose run --rm migrate        ← アプリを入れ替える前に流す
#   docker compose up -d
#
# イメージは GitHub Actions の Deploy ワークフローが作って push する。
#
# nginx-proxy と postgres は既に動いているものへ相乗りする。

name: tasktasktask-work

services:
  app:
    # .env に必ず書く。既定値を置かないのは、
    # 取り違えたイメージを黙って動かさないためである。
    image: ${APP_IMAGE:?APP_IMAGE を .env に設定してください}
    container_name: tasktasktask-work-app
    restart: unless-stopped

    # DATABASE_URL, APP_ORIGIN, SMTP_URL などはここから読む
    env_file: .env

    environment:
      # nginx-proxy が振り分けに使う
      VIRTUAL_HOST: tasktasktask.work
      VIRTUAL_PORT: "3000"

      # nginx の既定は 1MB。添付は1ファイル10MBまで許すので、
      # ここを上げておかないと本番でだけ 413 になる。
      CLIENT_MAX_BODY_SIZE: 12m

      NODE_ENV: production
      ATTACHMENTS_DIR: /var/lib/task3/attachments

      # timestamptz の入出力はセッションの設定で変換される。
      # 表示のための変換は organizations.timezone を使ってアプリが行うので、
      # ここは UTC に固定する。
      TZ: UTC
      PGTZ: UTC

    # ホストには晒さない。nginx-proxy だけが到達する。
    expose:
      - "3000"

    volumes:
      # 実体はファイルシステム側にある。データベースだけ戻しても復旧しない。
      - ./data/attachments:/var/lib/task3/attachments

    networks:
      - nginxproxy-network
      - postgres-network

  # スキーマの適用。up -d では起動しない（profiles があるため）。
  #
  #   docker compose run --rm migrate
  #
  # app と別のサービスにしてあるのは、restart の方針を引き継がせないためである。
  # unless-stopped は終了コードに関わらず起動し直す。
  # 一時的な処理に付くと、終わるたびに走り直して止まらなくなる。
  # migrate は Atlas と Node を毎回立ち上げてデータベースを叩くので、
  # 回り続ければ CPU を食い尽くす。
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE を .env に設定してください}
    profiles: ["tools"]
    restart: "no"
    command: migrate
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: UTC
      PGTZ: UTC
    # 添付の置き場も nginx-proxy も要らない。データベースにだけ届けばよい。
    networks:
      - postgres-network

networks:
  nginxproxy-network:
    external: true
  postgres-network:
    external: true
