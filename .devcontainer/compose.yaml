services:
  app:
    image: localhost/tasktasktask-work-app:dev
    build:
      context: ..
      dockerfile: ./.devcontainer/Dockerfile
    container_name: tasktasktask-work-app
    command: sleep infinity
    volumes:
      - .claude:/home/vscode/.claude
      - .claude.json:/home/vscode/.claude.json
      - ..:/workspace
    networks:
      app-network:
      localhost-postgresql-network:

  reverse-proxy:
    image: nginx:1.29.3-trixie
    container_name: tasktasktask-work-reverse-proxy
    volumes:
      - ./reverse-proxy/etc/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../docs:/etc/nginx/html
    environment:
      VIRTUAL_HOST: "*.tasktasktask.work.localhost"
    networks:
      app-network:
      localhost-proxy-network:

networks:
  app-network:
  localhost-proxy-network:
    external: true
  localhost-postgresql-network:
    external: true
